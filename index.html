  <body>
    <div id="root"></div>
    <script>
      // Clear old service worker caches from previous base path
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          regs.forEach(r => {
            if (r.active && r.active.scriptURL.includes('/sw.js') && !r.active.scriptURL.includes('/shibam/')) {
              r.unregister();
              caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
            }
          });
        });
      }
    </script>
